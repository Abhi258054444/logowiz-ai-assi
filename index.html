<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowiz AI - Professional Logo Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'rgb(var(--primary-rgb) / <alpha-value>)',
              slate: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#020617', 
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Neon Green #62FFB8 */
        --primary-rgb: 98 255 184; 
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for webkit - Dark Mode */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>

    "js-tiktoken": "https://esm.sh/js-tiktoken@1.0.10"
  }
}

</head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-primary/30 selection:text-primary">
